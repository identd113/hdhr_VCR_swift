<svg xmlns="http://www.w3.org/2000/svg" width="660" height="500" viewBox="0 0 660 500">
  <!-- Classic Mac DMG background: a soft, modern echo of the original desktop's 2x2 dithered
       checkerboard pattern (visible in the reference screenshot's own desktop) — much lower
       contrast here so it reads as texture behind icons rather than competing with them. Icon
       positions below are chosen to line up with create-dmg's icon-placement coordinates for this
       same file (see tools/build_dmg.sh) — this file and that script must be edited together if
       either one's layout changes. Original composition, not a reproduction of any specific
       Apple artwork. -->
  <defs>
    <pattern id="deskPattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#f4f1ec"/>
      <rect width="2" height="2" fill="#e9e4da"/>
      <rect x="2" y="2" width="2" height="2" fill="#e9e4da"/>
    </pattern>
  </defs>

  <rect width="660" height="500" fill="url(#deskPattern)"/>

  <!-- header band -->
  <rect x="0" y="0" width="660" height="60" fill="#ffffff" opacity="0.88"/>
  <line x1="0" y1="60" x2="660" y2="60" stroke="#000000" stroke-width="2" opacity="0.7"/>
  <text x="330" y="38" text-anchor="middle" font-family="Geneva, Helvetica, sans-serif"
        font-weight="bold" font-size="21" fill="#000000">hdhrVCRplus</text>

  <!-- install-row arrow, between the app icon (center 170,170) and the Applications alias
       (center 490,170) — icon labels sit below each icon at roughly y=210, clear of this line -->
  <g stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 250 170 L 400 170"/>
    <path d="M 380 153 L 400 170 L 380 187"/>
  </g>

  <text x="330" y="262" text-anchor="middle" font-family="Geneva, Helvetica, sans-serif"
        font-size="14" fill="#000000">Drag hdhrVCRplus into the Applications folder to install.</text>

  <line x1="120" y1="288" x2="540" y2="288" stroke="#000000" stroke-width="1.4" opacity="0.35"/>

  <!-- Read Me icon sits at center (330,370) — its own label lands around y=410 -->
  <text x="330" y="430" text-anchor="middle" font-family="Geneva, Helvetica, sans-serif"
        font-size="13" fill="#333333">New here? Open the Read Me for a quick tour.</text>

  <rect x="0" y="472" width="660" height="28" fill="#ffffff" opacity="0.88"/>
  <line x1="0" y1="472" x2="660" y2="472" stroke="#000000" stroke-width="1.4" opacity="0.6"/>
  <text x="330" y="490" text-anchor="middle" font-family="Geneva, Helvetica, sans-serif"
        font-size="11" fill="#555555">Free &amp; open-source — hdhrVCRplus</text>
</svg>
