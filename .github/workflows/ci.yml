name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # macos-latest for now; pin to a specific runner image (e.g. macos-15) if it stops
    # shipping an Xcode with the macOS 15 SDK this package's Package.swift requires.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Swift/Xcode versions
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        # -warn-long-function-bodies/-warn-long-expression-type-checking (both -Xfrontend, so
        # double -Xswiftc) are a canary for the class of bug that broke CI 2026-09-26 through
        # 2026-09-28: VLCPlayerView.body grew into one ~300-line chained SwiftUI expression until
        # the type-checker gave up outright ("unable to type-check this expression in reasonable
        # time"). 250ms sits just under VLCPlayerView.body's own post-fix time (488ms — it's the
        # slowest in the codebase and worth watching, not yet worth splitting further) and just
        # above the next-slowest legitimate bodies (MenuContent.body ~275ms, VLCPlayerView.toolbar
        # ~291ms) at the time this was added — so it'll flag those plus any new one that joins
        # them, without being so tight it fires on every ordinary view. Warnings only, deliberately
        # non-blocking (no -warnings-as-errors) — a canary to watch, not a merge gate.
        run: swift build -Xswiftc -Xfrontend -Xswiftc -warn-long-function-bodies=250 -Xswiftc -Xfrontend -Xswiftc -warn-long-expression-type-checking=250

      - name: Test
        # Tests/hdhr_VCRTests needs full Xcode (not just Command Line Tools) — GitHub-hosted
        # macOS runners have it preinstalled, so this should just work. See CLAUDE.md.
        # SnapshotTests is skipped: its reference images live in __Snapshots__/, which is
        # gitignored by design (CLAUDE.md/RECORD_SNAPSHOTS=1) since rendering can differ across
        # machines/GPUs — there's no baseline for a fresh CI checkout to compare against, so this
        # suite is meant to be run and reviewed locally, not gated in CI.
        run: swift test --skip SnapshotTests

      - name: Strict concurrency check (hdhr_VCR, hdhr_guide_core)
        # Start of a Swift 6 strict-concurrency migration (2026-09-28) — kept as a separate,
        # CI-only, warnings-only pass rather than added to Package.swift, so it doesn't spam every
        # local `swift build`/`./deploy.sh` with ~110 warnings on top of the normal zero. Only
        # these two targets are included: as of 2026-09-28 both build under
        # -strict-concurrency=complete with warnings only (0 errors) — hdhr_VCR has ~110 warning
        # sites, over half in WebServer.swift (NWConnection callback closures capturing
        # non-Sendable state), the rest scattered across AppState/VirtualTunerService/
        # VLCPlayerView/VLCBridge/HDHRManager/Models/DiscordNotifier/ConfigManager/SettingsView/
        # AddShowView — hdhr_guide_core is already fully clean. `hdhr_guide` itself is
        # deliberately excluded: it has real hard errors under this flag (global mutable state —
        # e.g. a `signal()`-handler-set `interrupted` var — predating any actor isolation, see
        # TODO.md's "Swift 6 strict concurrency migration" entry), not just warnings, so including
        # it would fail this step outright. Non-blocking by construction: warnings never fail
        # `swift build`, so this step passing says nothing about whether the warning count grew —
        # watch the log, don't just watch the checkmark.
        run: |
          swift build --target hdhr_VCR -Xswiftc -strict-concurrency=complete
          swift build --target hdhr_guide_core -Xswiftc -strict-concurrency=complete
